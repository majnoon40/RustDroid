name: Build RustDroid Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk layout before cleanup
        run: |
          df -h
          echo "---"
          lsblk

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils lld cmake ninja-build patchelf

      - name: Install Android NDK r27c
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      # Caches both LLVM build trees (host x86_64 + target aarch64-android).
      # Keyed on the two files that actually change LLVM's build inputs —
      # bootstrap.toml.template (LLVM config: thin-lto, targets, etc.) and
      # build.sh (in case shim/link flags feeding into the build change).
      # Editing anything else (e.g. this workflow file, docs) won't bust
      # the cache. If LLVM itself finished but a later step (rustc linking,
      # dist packaging) fails, the next run restores LLVM instantly instead
      # of rebuilding ~2,600 + ~2,600 compile units from scratch.
      - name: Restore LLVM build cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            stage/rust-src/build/x86_64-unknown-linux-gnu/llvm
            stage/rust-src/build/aarch64-linux-android/llvm
          key: llvm-${{ hashFiles('bootstrap.toml.template', 'build.sh') }}

      - name: Run toolchain build
        run: |
          chmod +x ./build.sh
          ./build.sh all

      - name: Show disk usage mid/post-build (debugging aid)
        if: always()
        run: df -h

      - name: List dist output
        run: ls -la ./stage/dist/

      - name: Extract dist tarballs for verification
        run: |
          mkdir -p ./stage/dist-extracted
          shopt -s nullglob
          found_any=0
          for f in ./stage/dist/*.tar.xz ./stage/dist/*.tar.gz; do
            [[ -e "$f" ]] || continue
            found_any=1
            echo "Extracting $f"
            tar -xf "$f" -C ./stage/dist-extracted
          done
          if [[ "$found_any" -eq 0 ]]; then
            echo "No .tar.xz/.tar.gz files found in ./stage/dist/ — see 'List dist output' step above"
            exit 1
          fi
          find ./stage/dist-extracted -type f | head -20

      - name: Run verification
        run: |
          chmod +x ./verify.sh
          ./verify.sh ./stage/dist-extracted/

      - name: Save LLVM build cache
        if: always() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            stage/rust-src/build/x86_64-unknown-linux-gnu/llvm
            stage/rust-src/build/aarch64-linux-android/llvm
          key: llvm-${{ hashFiles('bootstrap.toml.template', 'build.sh') }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Upload toolchain artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdroid-toolchain-aarch64
          path: ./stage/dist/
          retention-days: 14
