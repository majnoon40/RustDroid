name: Build RustDroid Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk layout before cleanup
        run: |
          df -h
          echo "---"
          lsblk

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils cmake ninja-build patchelf

      - name: Install Android NDK r27c
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Run toolchain build
        run: |
          chmod +x ./build.sh
          ./build.sh all

      - name: Show disk usage mid/post-build (debugging aid)
        if: always()
        run: df -h

      - name: Run verification
        run: |
          chmod +x ./verify.sh
          ./verify.sh ./stage/dist/rust-1.85.0-aarch64-linux-android.tar.xz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Upload toolchain artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdroid-toolchain-aarch64
          path: ./stage/dist/rust-1.85.0-aarch64-linux-android.tar.xz
          retention-days: 14
