name: Build RustDroid Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk layout before cleanup
        run: |
          df -h
          echo "---"
          lsblk

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils lld cmake ninja-build patchelf ccache

      - name: Install Android NDK r27c
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      # Caches both LLVM build trees (host x86_64 + target aarch64-android).
      # The key covers EVERY input that can affect the generated build tree:
      #   - bootstrap.toml.template: LLVM cmake config (thin-lto, targets...)
      #   - build.sh:               flags/shim/link steps feeding the build
      #   - env.sh:                 RUST_TAG + NDK version/API (paths baked
      #                             into build.ninja) — also covers the Rust
      #                             source identity (the pinned tag)
      #   - patches/**:             vendored-source patches
      #   - shims/**:               kit sources linked into the dist
      # If LLVM itself finished but a later step (rustc linking, dist
      # packaging) fails, the next run restores the SAME key instantly.
      #
      # NO broad `llvm-` restore-key fallback: GitHub matches restore-keys
      # by prefix and would happily restore an INCOMPATIBLE tree after any
      # input change — a stale tree that ninja cannot always detect (mtimes
      # are touched post-restore). A miss costs a rebuild, but ccache (the
      # content-addressed layer below) makes that rebuild cheap; a wrong
      # HIT would silently ship a toolchain built from mismatched inputs.
      - name: Restore LLVM build cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            stage/rust-src/build/x86_64-unknown-linux-gnu/llvm
            stage/rust-src/build/aarch64-linux-android/llvm
          key: llvm-v2-${{ hashFiles('bootstrap.toml.template', 'build.sh', 'env.sh', 'patches/**', 'shims/**') }}

      # ccache layer — rebuild insurance for the C/C++ parts (LLVM, lld,
      # compiler-rt). Bootstrap enables it via `[llvm] ccache` in
      # config.toml (CMAKE_{C,CXX}_COMPILER_LAUNCHER). When the LLVM
      # build-tree cache above hits, ccache is not even consulted; when it
      # misses (key change, cmake command change, eviction), a warm ccache
      # turns the ~5,200-unit rebuild into mostly cache hits.
      # Unlike the LLVM tree cache, ccache is CONTENT-ADDRESSED (hash of
      # compiler + flags + preprocessed input), so a broad restore-key is
      # safe here: stale entries can never produce a wrong build.
      # Key is unique per run (github.run_id) so every run saves a fresh
      # snapshot; the restore-key picks up the newest previous one.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: stage/ccache
          key: ccache-v1-${{ github.run_id }}
          restore-keys: |
            ccache-v1-
      - name: Show ccache stats (pre-build)
        run: |
          ccache --version | head -1
          CCACHE_DIR=$PWD/stage/ccache ccache -s || true

      - name: Run toolchain build
        env:
          # The NDK SHA1 must be ENFORCED in CI: a release build must never
          # continue past a corrupted/tampered 1.5 GB archive. build.sh
          # defaults to required; this makes the CI policy explicit.
          NDK_SHA1_REQUIRED: "1"
        run: |
          chmod +x ./build.sh
          ./build.sh all

      - name: Show disk usage mid/post-build (debugging aid)
        if: always()
        run: df -h

      - name: Show ccache stats (post-build)
        if: always()
        run: |
          CCACHE_DIR=$PWD/stage/ccache ccache -s || true
          du -sh ./stage/ccache 2>/dev/null || true

      - name: List dist output
        run: ls -la ./stage/dist/

      - name: Extract dist tarballs for verification
        run: |
          mkdir -p ./stage/dist-extracted
          shopt -s nullglob
          found_any=0
          # Primary: ./stage/dist (populated by build.sh's copy step).
          # Fallback: x.py's raw output dir, in case an older build.sh ran
          # or the copy step is skipped.
          # Dedup by basename: stage/dist is a cp -a of build/dist, so the
          # fallback dir only contributes files the copy missed. Run #20
          # extracted every tarball TWICE (~13 wasted minutes).
          declare -A seen=()
          for dir in ./stage/dist ./stage/rust-src/build/dist; do
            for f in "$dir"/*.tar.xz "$dir"/*.tar.gz; do
              [[ -e "$f" ]] || continue
              base="$(basename "$f")"
              if [[ -n "${seen[$base]:-}" ]]; then
                echo "Skipping duplicate: $f (already extracted from stage/dist)"
                continue
              fi
              seen["$base"]=1
              found_any=1
              echo "Extracting $f"
              tar -xf "$f" -C ./stage/dist-extracted
            done
          done
          if [[ "$found_any" -eq 0 ]]; then
            echo "No .tar.xz/.tar.gz files found in ./stage/dist/ or ./stage/rust-src/build/dist/"
            echo "=== ./stage/dist ==="
            ls -la ./stage/dist/ || true
            echo "=== ./stage/rust-src/build/dist ==="
            ls -la ./stage/rust-src/build/dist/ || true
            exit 1
          fi
          find ./stage/dist-extracted -type f | head -20

      - name: Run verification
        run: |
          chmod +x ./verify.sh
          ./verify.sh ./stage/dist-extracted/

      - name: Save LLVM build cache
        if: always() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            stage/rust-src/build/x86_64-unknown-linux-gnu/llvm
            stage/rust-src/build/aarch64-linux-android/llvm
          key: llvm-v2-${{ hashFiles('bootstrap.toml.template', 'build.sh', 'env.sh', 'patches/**', 'shims/**') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stage/ccache
          key: ccache-v1-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Upload toolchain artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdroid-toolchain-aarch64
          path: ./stage/dist/
          retention-days: 14
